<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Exemplo de formulários</h1>

    <form action="cadastro.js" method="post">

        <p>
            <label for="ies">Estado:</label>
            <select name="estado" id="ies">
                <optgroup label="Região Nordeste">
                    <option value="BA">Bahia</option>
                    <option value="PE" selected >Pernambuco</option>
                    <option value="Ma">Maranhão</option>
                </optgroup>

                    <optgroup label="Sudeste">
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão:</label>
            <input type="text" name="prof" id="iprof" list="lisprof">
            <datalist id="lisprof">
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
                <option value="PEDR">Pedreiro</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem:</label>
            <textarea name="mens" id="imsg" cols="30" rows="10">

            </textarea>
        </p>
        
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
